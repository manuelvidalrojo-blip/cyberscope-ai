# Objetivo de laboratorio para demostraciones: configuración deliberadamente
# incompleta (solo 2 cabeceras de seguridad y versión del servidor visible).
server {
    listen 80;
    server_tokens on;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    location / {
        default_type text/html;
        return 200 "<h1>Laboratorio CyberScope</h1>";
    }
}
